<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f5f6f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="轻账">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>轻账 · 私人记账</title>
<link id="appIcon" rel="apple-touch-icon" href="">
<link id="appManifest" rel="manifest" href="">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
:root{--bg:#f4f6fa;--surface:#fff;--surface2:#f0f2f7;--surface3:#e9edf4;--text:#171b26;--text2:#6d7688;--text3:#a0a9b9;--line:#e7ebf2;--accent:#5b5bd6;--accent2:#8b7cf0;--accent-soft:#eeedfe;--on-accent:#fff;--expense:#e2603f;--income:#12996f;--warn:#d99020;--danger:#dc4250;--info:#2f7fd1;--r:18px;--r-sm:12px;--shadow:0 10px 34px rgba(24,34,64,.09);--font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
[data-theme="dark"]{--bg:#0d1016;--surface:#171b23;--surface2:#202632;--surface3:#2a3140;--text:#edf1f7;--text2:#98a3b5;--text3:#6d788b;--line:#2a3140;--accent:#8f8ff2;--accent2:#aa97ff;--accent-soft:#282848;--on-accent:#101427;--expense:#ff916f;--income:#4fd4a8;--warn:#f1bb58;--danger:#ff7480;--info:#6db0f5;--shadow:0 10px 34px rgba(0,0,0,.42)}
body{font-family:var(--font);font-size:15px;color:var(--text);background:linear-gradient(145deg,#e8ecf6 0%,#f6f7fb 45%,#ece9f8 100%);display:flex;align-items:center;justify-content:center;overflow:hidden}
[data-theme="dark"] body{background:linear-gradient(145deg,#0b0e14,#141824 50%,#161326)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{outline:none;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:10px;padding:10px 12px;width:100%;min-height:42px}
textarea{min-height:78px;resize:vertical;line-height:1.5}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text3) 50%),linear-gradient(135deg,var(--text3) 50%,transparent 50%);background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=checkbox]{width:18px;height:18px;min-height:0;accent-color:var(--accent)}
input[type=date],input[type=time],input[type=month]{color-scheme:light}
[data-theme="dark"] input[type=date],[data-theme="dark"] input[type=time],[data-theme="dark"] input[type=month]{color-scheme:dark}
#app{display:flex;align-items:center;gap:40px;max-width:100%;padding:16px}
.phone-frame{width:392px;height:832px;max-height:calc(100vh - 32px);flex:none;background:#12151d;border-radius:46px;padding:9px;box-shadow:0 30px 80px rgba(20,26,50,.28),0 2px 6px rgba(0,0,0,.2);position:relative}
.phone-frame:after{content:"";position:absolute;top:19px;left:50%;transform:translateX(-50%);width:96px;height:22px;background:#12151d;border-radius:0 0 14px 14px;z-index:70;pointer-events:none}
.screen{width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;position:relative;isolation:isolate}
.side-info{width:270px;color:#3a4256;line-height:1.75;font-size:13px}
[data-theme="dark"] .side-info{color:#aab3c4}
.side-info h2{font-size:19px;font-weight:600;margin:0 0 8px;letter-spacing:.5px}
.side-info p{margin:0 0 18px}
.side-info ul{padding-left:18px;margin:0}
.side-info li{margin-bottom:6px}
.side-badge{display:inline-block;background:rgba(91,91,214,.12);color:#4a4ac0;padding:3px 10px;border-radius:20px;font-size:12px;margin-bottom:14px}
.topbar{flex:none;padding:34px 18px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.topbar h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.4px;line-height:1.2}
.topbar .sub{font-size:12px;color:var(--text2);margin-top:3px}
.top-actions{display:flex;gap:6px;align-items:center}
.icon-btn{width:34px;height:34px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--text2);flex:none;transition:transform .15s}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:17px;height:17px}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 16px 26px;scrollbar-width:thin;scroll-behavior:smooth}
#view::-webkit-scrollbar{width:4px}#view::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(20,30,60,.025)}
.card.tight{padding:12px 14px}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.card-h h3{margin:0;font-size:14px;font-weight:600}
.card-h .link{font-size:12px;color:var(--accent)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--text2)}.small{font-size:12px}.tiny{font-size:11px}.big{font-size:24px;font-weight:650}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hidden-amt{letter-spacing:2px}
.hero{background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);color:#fff;border:0;position:relative;overflow:hidden;padding:18px}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.11)}
.hero:before{width:170px;height:170px;right:-60px;top:-80px}
.hero:after{width:100px;height:100px;right:20px;bottom:-70px}
.hero .lbl{font-size:12px;opacity:.85;position:relative}
.hero .val{font-size:30px;font-weight:650;margin:6px 0 14px;position:relative;letter-spacing:-.8px}
.hero .foot{display:flex;gap:18px;position:relative;font-size:12px}
.hero .foot b{display:block;font-size:15px;font-weight:600;margin-top:2px}
.hero .eye{position:absolute;right:16px;top:16px;z-index:2;color:#fff;opacity:.85}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 14px}
.stat .lbl{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px}
.stat .val{font-size:19px;font-weight:650;margin-top:6px}
.stat.e .val{color:var(--expense)}.stat.i .val{color:var(--income)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.progress{height:8px;background:var(--surface3);border-radius:20px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;border-radius:20px;background:var(--accent);transition:width .5s}
.progress.warn i{background:var(--warn)}.progress.over i{background:var(--danger)}
.ring-wrap{display:flex;align-items:center;gap:16px}
.ring{width:82px;height:82px;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border-radius:20px;padding:5px 11px;font-size:12px;color:var(--text2);white-space:nowrap}
.pill.on{background:var(--accent-soft);color:var(--accent)}
.chip{padding:6px 12px;border-radius:20px;background:var(--surface2);font-size:12px;color:var(--text2);white-space:nowrap;border:1px solid transparent}
.chip.active{background:var(--accent);color:var(--on-accent)}
.seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:12px;color:var(--text2);white-space:nowrap}
.seg button.active{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 5px rgba(0,0,0,.07)}
.scroll-x{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;margin:0 -2px}
.scroll-x::-webkit-scrollbar{display:none}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.list-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);min-height:46px}
.list-item:last-child{border-bottom:0}
.list-item:active{background:var(--surface2)}
.list-item .ico-box{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--surface2);color:var(--text2)}
.list-item .ico-box svg{width:16px;height:16px}
.list-item .label{font-size:13.5px}
.list-item .desc{font-size:11px;color:var(--text2);margin-top:1px}
.list-item .value{font-size:13px;color:var(--text2);text-align:right;max-width:45%}
.chev{color:var(--text3);flex:none}
svg.chev{width:15px;height:15px;display:block;flex:none}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--text2);margin:13px 4px 7px;font-weight:600;letter-spacing:.3px}
.section-title .sec-hint{font-size:11px;color:var(--text3);font-weight:400;letter-spacing:0}
.txn-group{margin-bottom:6px}
.txn-group .gh{display:flex;justify-content:space-between;padding:10px 4px 6px;font-size:12px;color:var(--text2)}
.txn-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.txn-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--line);position:relative}
.txn-item:last-child{border-bottom:0}
.txn-item:active{background:var(--surface2)}
.txn-ico{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;font-size:17px}
.txn-ico svg{width:19px;height:19px}
.txn-meta{min-width:0;flex:1}
.txn-meta .t1{font-size:14px;font-weight:550}
.txn-meta .t2{font-size:11px;color:var(--text2);margin-top:2px}
.txn-amt{font-size:15px;font-weight:600;text-align:right;white-space:nowrap}
.txn-amt.e{color:var(--expense)}.txn-amt.i{color:var(--income)}.txn-amt.t{color:var(--text2)}
.txn-check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex:none;display:none;align-items:center;justify-content:center}
.selecting .txn-check{display:flex}
.txn-item.sel .txn-check{background:var(--accent);border-color:var(--accent);color:#fff}
.txn-item.sel .txn-check svg{width:13px;height:13px}
.tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);margin-right:4px}
.badge{font-size:10px;padding:2px 7px;border-radius:6px;background:var(--surface2);color:var(--text2)}
.badge.warn{background:rgba(217,144,32,.14);color:var(--warn)}
.badge.ok{background:rgba(18,153,111,.13);color:var(--income)}
.badge.danger{background:rgba(220,66,80,.13);color:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;background:var(--surface2);color:var(--text);font-size:14px;font-weight:550;min-height:42px;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{background:rgba(220,66,80,.12);color:var(--danger)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:7px 11px;min-height:34px;font-size:12px;border-radius:9px}
.btn.block{width:100%}
.btn svg{width:16px;height:16px}
.btn-row{display:flex;gap:8px}.btn-row>*{flex:1}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-row .field{margin-bottom:12px}
.hint{font-size:11px;color:var(--text3);line-height:1.5;margin-top:5px}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:12px;padding:9px 12px;margin-bottom:10px}
.searchbar input{border:0;background:transparent;padding:0;min-height:0;flex:1}
.searchbar svg{width:16px;height:16px;color:var(--text2);flex:none}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px 4px;max-height:206px;overflow-y:auto;padding:2px}
.cat-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:5px 0;border-radius:11px}
.cat-item .ci{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--text2)}
.cat-item .ci svg{width:20px;height:20px}
.cat-item span{font-size:11px;color:var(--text2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cat-item.active .ci{background:var(--accent);color:var(--on-accent)}
.cat-item.active span{color:var(--accent);font-weight:600}
.amount-box{background:var(--surface2);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.amount-box .lbl{font-size:11px;color:var(--text2)}
.amount-box .disp{font-size:32px;font-weight:650;letter-spacing:-1px;margin-top:2px;min-height:40px;word-break:break-all}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.keypad button{height:48px;border-radius:12px;background:var(--surface2);font-size:19px;font-weight:550;display:flex;align-items:center;justify-content:center;color:var(--text)}
.keypad button:active{background:var(--surface3)}
.keypad button.fn{font-size:14px;color:var(--text2)}
.keypad button.ok{background:var(--accent);color:var(--on-accent);grid-row:span 2;height:auto;font-size:14px}
.tabbar{flex:none;height:calc(62px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:stretch;position:relative;z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text3);font-size:10px;position:relative}
.tab svg{width:21px;height:21px}
.tab.active{color:var(--accent)}
.tab.active:before{content:"";position:absolute;top:0;width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab.mid{justify-content:flex-end;padding-bottom:8px}
.tab-plus{position:absolute;left:50%;top:-20px;transform:translateX(-50%);width:52px;height:52px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(91,91,214,.38);border:4px solid var(--surface)}
.tab-plus svg{width:24px;height:24px}
.tab-plus:active{transform:translateX(-50%) scale(.93)}
.sheet{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-mask{position:absolute;inset:0;background:rgba(12,16,28,.44);animation:fade .2s}
.sheet-panel{position:relative;background:var(--surface);border-radius:26px 26px 0 0;max-height:90%;display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.12)}
.sheet-panel.full{height:92%}
.sheet-head{flex:none;padding:16px 18px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:16px;font-weight:650}
.sheet-head .x{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--text2)}
.sheet-head .x svg{width:15px;height:15px}
.sheet-body{flex:1;overflow-y:auto;padding:16px 18px calc(20px + env(safe-area-inset-bottom));scrollbar-width:thin}
.sheet-foot{flex:none;padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:absolute;left:50%;bottom:82px;transform:translateX(-50%);background:rgba(24,28,40,.94);color:#fff;padding:11px 16px;border-radius:14px;font-size:13px;z-index:90;display:flex;align-items:center;gap:12px;max-width:86%;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:fade .18s}
.toast button{color:#8f8ff2;font-weight:600;font-size:13px;white-space:nowrap}
.empty{text-align:center;padding:38px 16px;color:var(--text2);font-size:13px}
.empty .ei{width:60px;height:60px;border-radius:20px;background:var(--surface2);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--text3)}
.empty .ei svg{width:28px;height:28px}
.divider{height:1px;background:var(--line);margin:14px 0}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;position:relative;background:var(--surface2);color:var(--text2)}
.cal-cell.mute{opacity:.28}
.cal-cell.today{outline:2px solid var(--accent);outline-offset:-2px;color:var(--text);font-weight:650}
.cal-cell.has{background:var(--accent-soft);color:var(--accent)}
.cal-cell .cd{width:4px;height:4px;border-radius:50%;background:var(--expense);position:absolute;bottom:5px}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px;color:var(--text3);margin-bottom:6px}
.chart-wrap{width:100%;overflow:hidden}
.chart-wrap svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)}
.legend-item .dot{width:8px;height:8px}
.rank-row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.rank-row .rn{font-size:13px;width:15px;color:var(--text3)}
.rank-row .rb{flex:1;min-width:0}
.rank-row .rt{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.rank-row .rbar{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden}
.rank-row .rbar i{display:block;height:100%;border-radius:6px}
.lock{position:absolute;inset:0;background:linear-gradient(150deg,var(--accent),var(--accent2));z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:14px}
.lock .lt{font-size:19px;font-weight:600}
.lock .lp{font-size:12px;opacity:.8}
.lock .ldots{display:flex;gap:12px;margin:10px 0}
.lock .ldots i{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7)}
.lock .ldots i.on{background:#fff;border-color:#fff}
.lock .lkeys{display:grid;grid-template-columns:repeat(3,64px);gap:12px;margin-top:6px}
.lock .lkeys button{height:56px;border-radius:18px;background:rgba(255,255,255,.16);color:#fff;font-size:20px}
.lock .lkeys button:active{background:rgba(255,255,255,.32)}
.onboard{position:absolute;inset:0;z-index:95;background:var(--bg);display:flex;flex-direction:column;padding:52px 26px calc(30px + env(safe-area-inset-bottom))}
.onboard .ob-logo{width:72px;height:72px;border-radius:24px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:26px}
.onboard .ob-logo svg{width:38px;height:38px}
.onboard h2{font-size:27px;margin:0 0 10px;font-weight:650;letter-spacing:-.5px}
.onboard p{color:var(--text2);font-size:14px;line-height:1.7;margin:0 0 10px}
.onboard .ob-feats{margin:18px 0 28px}
.onboard .ob-feats div{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px}
.onboard .ob-feats i{width:26px;height:26px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:650}
.onboard .ob-spacer{flex:1}
.chk{display:flex;align-items:center;gap:9px;font-size:13px;padding:7px 0}
.chk input{width:17px;height:17px;min-height:0;flex:none}
.photo-prev{width:64px;height:64px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.print-only{display:none}
.reduce-motion *{animation-duration:.01ms!important;transition-duration:.01ms!important}
@media print{body{background:#fff}#app,.phone-frame,.screen{display:block;width:auto;height:auto;max-height:none;padding:0;border-radius:0;box-shadow:none}.topbar,.tabbar,.side-info,.sheet,.toast,.no-print{display:none!important}#view{overflow:visible;padding:0}.print-only{display:block}}
@media (max-width:760px){.side-info{display:none}#app{padding:0;gap:0}.phone-frame{width:100vw;height:100dvh;max-height:none;border-radius:0;padding:0;box-shadow:none}.phone-frame:after{display:none}.screen{border-radius:0}.topbar{padding-top:max(16px,env(safe-area-inset-top))}}
/* 账务管理紧凑面板 */
.mgr-panel{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px;box-shadow:0 2px 10px rgba(20,30,60,.025)}
.mgr-cell{background:var(--surface);padding:10px 11px 9px;min-height:74px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;position:relative;transition:background .15s,transform .15s}
.mgr-cell:active{background:var(--surface2);transform:scale(.985)}
.mgr-cell.wide{grid-column:1/-1;min-height:86px;background:linear-gradient(118deg,var(--surface2),var(--surface) 72%)}
.mgr-head{display:flex;align-items:center;gap:8px;min-width:0;padding-right:14px}
.mgr-cell.wide .row{padding-right:16px}
.mgr-ico{width:27px;height:27px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.mgr-ico svg{width:15px;height:15px}
.mgr-name{font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgr-sub{font-size:10.5px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgr-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;min-width:0}
.mgr-val{font-size:17px;font-weight:650;line-height:1.05;white-space:nowrap}
.mgr-val.sm{font-size:15px}
.mgr-unit{font-size:10.5px;color:var(--text3);margin-left:3px;font-weight:400}
.mgr-tag{font-size:10.5px;color:var(--text2);background:var(--surface2);border-radius:20px;padding:3px 8px;white-space:nowrap;flex:none}
[data-theme="dark"] .mgr-tag{background:var(--surface3)}
.mgr-arrow{position:absolute;right:9px;top:9px;color:var(--text3);opacity:.5}
.mgr-arrow svg{width:13px;height:13px;display:block}
.dist-bar{display:flex;height:6px;border-radius:20px;overflow:hidden;background:var(--surface3);gap:1.5px}
.dist-bar i{display:block;height:100%;min-width:2px}
.mgr-progress{height:5px;border-radius:20px;background:var(--surface3);overflow:hidden;margin-top:7px}
.mgr-progress i{display:block;height:100%;border-radius:20px;background:var(--accent)}
.mgr-progress.warn i{background:var(--warn)}
.mgr-progress.over i{background:var(--danger)}
.acct-share{height:3px;border-radius:20px;background:var(--surface3);margin-top:5px;overflow:hidden}
.acct-share i{display:block;height:100%;border-radius:20px}
/* 进阶场景：单行横排紧凑列表 */
.mini-list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.mini-row{display:flex;align-items:center;gap:8px;height:37px;padding:0 10px;position:relative;transition:background .15s}
.mini-row+.mini-row:before{content:"";position:absolute;left:36px;right:0;top:0;height:1px;background:var(--line)}
.mini-row:active{background:var(--surface2)}
.mini-ico{width:21px;height:21px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none}
.mini-ico svg{width:12.5px;height:12.5px}
.mini-name{font-size:12.5px;font-weight:550;white-space:nowrap;flex:none;color:var(--text)}
.mini-desc{flex:1;min-width:0;text-align:right;font-size:10.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-chev{color:var(--text3);opacity:.5;flex:none;font-size:15px;line-height:1;margin-left:-3px}
@media (max-width:360px){.cat-grid{grid-template-columns:repeat(4,1fr)}.mgr-cell{padding:9px;min-height:70px}.mgr-val{font-size:15px}.mini-row{height:35px;gap:6px;padding:0 9px}.mini-desc{font-size:10px}}

function delEntity(e,id){const map={account:state.accounts,category:state.categories,tag:state.tags,book:state.books,recurring:state.recurring,subscription:state.subscriptions,goal:state.goals,installment:state.installments,template:state.templates};const arr=map[e];if(!arr)return;if(e==='account'&&state.txns.some(t=>t.accountId===id||t.toAccountId===id)){toast('该账户已有账单，不能删除；可改为「归档」');return}if(e==='category'&&state.txns.some(t=>t.categoryId===id)){toast('该分类已有账单，不能删除；可改为「隐藏」');return}if(e==='book'&&state.books.length<=1){toast('至少保留一个账本');return}if(e==='book'&&state.txns.some(t=>t.bookId===id)){toast('该账本下还有账单，请先清空或导出');return}confirmBox('确认删除','删除后不可恢复，确定继续吗？',()=>{const i=arr.findIndex(x=>x.id===id);if(i>=0)arr.splice(i,1);if(e==='book'&&state.settings.currentBook===id)state.settings.currentBook=state.books[0].id;save();closeSheet();render();toast('已删除');addHistory('删除'+e)},'删除')}
function entityRow(o,e,title,desc,val,color,icon){return '<div class="list-item" data-act="editEntity" data-e="'+e+'" data-id="'+o.id+'"><div class="ico-box" style="background:'+hexA(color,.14)+';color:'+color+'">'+ico(icon||'other')+'</div><div class="grow"><div class="label">'+esc(title)+'</div><div class="desc">'+esc(desc||'')+'</div></div><span class="small num">'+val+'</span>'+ico('right','chev')+'</div>'}
function openAccounts(){const total=state.accounts.filter(a=>a.included!==false&&!a.archived).reduce((s,a)=>s+accountBalance(a.id),0);const debt=state.accounts.filter(a=>a.type==='credit').reduce((s,a)=>s+Math.max(0,-accountBalance(a.id)),0);const live=state.accounts.filter(a=>!a.archived&&a.included!==false).map(a=>({name:a.name,c:a.color,v:Math.max(0,accountBalance(a.id))})).filter(x=>x.v>0);const lsum=live.reduce((s,x)=>s+x.v,0)||1;const distCell=live.length?'<div class="stat" style="grid-column:1/-1;padding-top:10px;padding-bottom:11px"><div class="between tiny muted" style="margin-bottom:7px"><span>资金分布</span><span>按账户余额占比</span></div><div class="dist-bar">'+live.map(x=>'<i style="width:'+(x.v/lsum*100).toFixed(1)+'%;background:'+x.c+'"></i>').join('')+'</div><div class="row" style="flex-wrap:wrap;gap:6px 12px;margin-top:9px">'+live.slice(0,5).map(x=>'<span class="row tiny muted" style="gap:5px"><i class="dot" style="background:'+x.c+'"></i>'+esc(x.name)+' '+Math.round(x.v/lsum*100)+'%</span>').join('')+'</div></div>':'';let html='<div class="stat-grid"><div class="stat"><div class="lbl">净资产</div><div class="val num">'+yuan(total,0)+'</div></div><div class="stat e"><div class="lbl">信用卡待还</div><div class="val num">'+yuan(debt,0)+'</div></div>'+distCell+'</div><div class="list">'+state.accounts.map(a=>entityRow(a,'account',a.name+(a.archived?'（已归档）':''),(a.type==='credit'?'额度 '+yuan(a.limit,0)+' · ':'')+(a.included===false?'不计入净资产':ACC_TYPES.find(t=>t[0]===a.type)?.[1]||''),yuan(accountBalance(a.id),0),a.color,a.icon)).join('')+'</div><div class="hint">账户余额由初始余额加减所有账单自动算出。删除有账单的账户会被阻止，可在编辑里取消「计入净资产」实现隐藏效果。</div>';openSheet('账户与资产',html,{foot:'<button class="btn primary block" data-act="newEntity" data-e="account">＋ 新增账户</button>'})}
function openCategories(){const tab=ui.catTab||'expense';const list=state.categories.filter(c=>c.type===tab).sort((a,b)=>(a.order||0)-(b.order||0));const html='<div class="seg" style="margin-bottom:12px"><button class="'+(tab==='expense'?'active':'')+'" data-act="catTab" data-t="expense">支出分类</button><button class="'+(tab==='income'?'active':'')+'" data-act="catTab" data-t="income">收入分类</button></div><div class="list">'+list.map(c=>entityRow(c,'category',c.name+(c.hidden?'（隐藏）':''),(c.parent?cat(c.parent).name+' / ':'')+'排序 '+(c.order||0)+' · '+state.txns.filter(t=>t.categoryId===c.id).length+' 笔','',c.color,c.icon)).join('')+'</div>';openSheet('分类管理',html,{foot:'<button class="btn primary block" data-act="newEntity" data-e="category">＋ 新增分类</button>'})}
function manageTags(){const html='<div class="list">'+state.tags.map(t=>entityRow(t,'tag','#'+t.name,state.txns.filter(x=>(x.tags||[]).includes(t.id)).length+' 笔账单','',t.color,'tag')).join('')+'</div><div class="hint">标签是跨分类的统计维度，比如「双11」「装修」「日本旅行」，可以给一笔账打多个标签。</div>';openSheet('标签管理',html,{foot:'<button class="btn primary block" data-act="newEntity" data-e="tag">＋ 新增标签</button>'})}
function manageTemplates(){const html='<div class="list">'+state.templates.map(t=>entityRow(t,'template',t.name,cat(t.categoryId).name+' · '+acc(t.accountId).name,yuan(t.amount,0),'#E28FA5','star')).join('')+'</div>'+(state.templates.length?'<div class="hint">在首页「快捷记账」点一下即可带出金额与分类。</div>':'')+(state.templates.length?'<button class="btn ghost block sm" data-act="useTemplate" data-id="'+state.templates[0].id+'">试一下第一个模板</button>':'');openSheet('快捷模板',html,{foot:'<button class="btn primary block" data-act="newEntity" data-e="template">＋ 新增模板</button>'})}
function goBudget(){const b=state.budgets,cs=state.categories.filter(c=>c.type==='expense'&&!c.hidden);const html='<div class="form-row"><div class="field"><label>月度总预算</label><input type="number" id="bMonthly" value="'+(b.monthly||0)+'"></div><div class="field"><label>周预算</label><input type="number" id="bWeekly" value="'+(b.weekly||0)+'"></div></div><div class="chk"><input type="checkbox" id="bRollover" '+(state.settings.budgetRollover?'checked':'')+'><label for="bRollover" style="margin:0;font-size:13px">预算结余滚存到下月</label></div><div class="divider"></div><div class="section-title" style="margin-left:0">分类预算（留空或 0 表示不限）</div>'+cs.map(c=>'<div class="row" style="padding:5px 0"><span class="dot" style="background:'+c.color+'"></span><span class="grow small">'+esc(c.name)+'</span><input type="number" data-bcat="'+esc(c.name)+'" value="'+(b.byCategory?.[c.name]||'')+'" placeholder="0" style="width:100px;min-height:34px;padding:6px 9px"></div>').join('')+'<div class="hint">预算进度在首页与「待办提醒」里实时显示，超支会变色提醒。</div>';openSheet('预算设置',html,{foot:'<button class="btn primary block" data-act="saveBudget">保存预算</button>'})}
function openBooks(){const html='<div class="list">'+state.books.map(b=>'<div class="list-item" data-act="switchBook" data-id="'+b.id+'"><div class="ico-box" style="background:'+hexA(b.color,.14)+';color:'+b.color+'">'+ico(b.icon)+'</div><div class="grow"><div class="label">'+esc(b.name)+(state.settings.currentBook===b.id?' <span class="badge ok">当前</span>':'')+'</div><div class="desc">'+state.txns.filter(t=>t.bookId===b.id).length+' 笔账单</div></div><button class="btn sm ghost" data-act="editEntity" data-e="book" data-id="'+b.id+'">编辑</button></div>').join('')+'</div><div class="hint">账本之间账单完全隔离，账户与分类共用。适合把旅行、装修、生意单独记账。</div>';openSheet('多账本',html,{foot:'<button class="btn primary block" data-act="newEntity" data-e="book">＋ 新增账本</button>'})}
function openRecurring(){const html='<div class="list">'+state.recurring.map(r=>entityRow(r,'recurring',r.name+(r.active?'':'（已停用）'),(r.freq==='monthly'?'每月':r.freq==='weekly'?'每周':r.freq==='yearly'?'每年':'每天')+' · 下次 '+r.nextDate,yuan(r.amount,0),'#8B8BF0','repeat')).join('')+'</div><div class="hint">打开应用时会自动补记已到期的周期账单（最多补 12 期），也可以在首页「待办提醒」里点一下立即生成。</div>';openSheet('周期账单',html,{foot:'<div class="btn-row"><button class="btn ghost" data-act="runRecurring">立即检查到期</button><button class="btn primary" data-act="newEntity" data-e="recurring">＋ 新增</button></div>'})}
function openSubs(){const monthly=state.subscriptions.filter(s=>s.active).reduce((n,s)=>n+(s.cycle==='yearly'?s.amount/12:s.cycle==='weekly'?s.amount*4.33:s.amount),0);const html='<div class="stat-grid"><div class="stat"><div class="lbl">订阅数</div><div class="val num">'+state.subscriptions.filter(s=>s.active).length+'</div></div><div class="stat e"><div class="lbl">折算月均</div><div class="val num">'+yuan(monthly,0)+'</div></div></div><div class="list">'+state.subscriptions.map(s=>entityRow(s,'subscription',s.name+(s.active?'':'（已取消）'),(s.cycle==='yearly'?'年付':s.cycle==='weekly'?'周付':'月付')+' · 下次 '+s.nextDate,yuan(s.amount,0),'#E9A94B','refresh')).join('')+'</div>';openSheet('订阅管理',html,{foot:'<button class="btn primary block" data-act="newEntity" data-e="subscription">＋ 新增订阅</button>'})}
function openLoans(){const rb=state.txns.filter(t=>t.reimbursable&&!t.reimbursed),ln=state.txns.filter(t=>t.loan&&!t.loanSettled);const row=(t,label)=>'<div class="list-item"><div class="ico-box" style="background:'+hexA('#6FC7AE',.14)+';color:#6FC7AE">'+ico('receipt')+'</div><div class="grow"><div class="label">'+esc(t.note||label)+'</div><div class="desc">'+t.date.slice(0,10)+' · '+acc(t.accountId).name+'</div></div><span class="small num">'+yuan(t.amount,0)+'</span><button class="btn sm primary" data-act="settleLoan" data-id="'+t.id+'">核销</button></div>';const html='<div class="section-title" style="margin-top:0">待报销（'+rb.length+'）</div><div class="list">'+(rb.length?rb.map(t=>row(t,'待报销')).join(''):'<div class="list-item muted small">没有待报销的账单</div>')+'</div><div class="section-title">借出 / 借入（'+ln.length+'）</div><div class="list">'+(ln.length?ln.map(t=>row(t,t.loan==='lend'?'借出':'借入')).join(''):'<div class="list-item muted small">没有未结清的往来</div>')+'</div><div class="hint">核销会自动生成一笔反向账单到同一账户，并把原记录标记为已结清，账目不会重复计算。</div>';openSheet('报销与借还',html)}
function openSplits(){const ts=state.txns.filter(t=>t.split);let html='';if(!ts.length)html=emptyBox('还没有 AA 分账记录','split');else ts.forEach(t=>{const pend=t.split.people.filter(p=>!p.settled),got=t.split.people.filter(p=>p.settled).reduce((s,p)=>s+p.amount,0);html+='<div class="card tight"><div class="between"><div><div style="font-weight:600">'+esc(t.note||'AA 分账')+'</div><div class="tiny muted">'+t.date.slice(0,10)+' · 共 '+yuan(t.split.total,0)+' · '+t.split.people.length+' 人</div></div><span class="badge '+(pend.length?'warn':'ok')+'">'+(pend.length?'待收 '+yuan(pend.reduce((s,p)=>s+p.amount,0),0):'已结清')+'</span></div><div class="progress" style="margin:10px 0"><i style="width:'+pct(got,t.split.total)+'%"></i></div>'+t.split.people.map((p,i)=>'<div class="between small" style="padding:5px 0"><span>'+esc(p.name)+(p.settled?' <span class="badge ok">已结</span>':'')+'</span><span class="row">'+yuan(p.amount,0)+(p.settled?'':' <button class="btn sm primary" data-act="settleSplit" data-id="'+t.id+'" data-i="'+i+'">结清</button>')+'</span></div>').join('')+'</div>'});openSheet('AA 分账',html)}
function openGoals(){const html=state.goals.map(g=>{const p=pct(g.saved,g.target);return '<div class="card"><div class="between"><div style="font-weight:650">'+esc(g.name)+'</div><span class="badge '+(p>=100?'ok':'')+'">'+p+'%</span></div><div class="between small muted" style="margin-top:6px"><span>已存 '+yuan(g.saved,0)+' / '+yuan(g.target,0)+'</span><span>'+esc(g.deadline||'')+'</span></div><div class="progress"><i style="width:'+clamp(p,0,100)+'%;background:'+g.color+'"></i></div><div class="hint">每月计划 '+yuan(g.monthlyPlan,0)+' · 还需 '+yuan(Math.max(0,g.target-g.saved),0)+'</div><div class="btn-row" style="margin-top:10px"><button class="btn sm" data-act="goalDeposit" data-id="'+g.id+'">存入一笔</button><button class="btn sm ghost" data-act="editEntity" data-e="goal" data-id="'+g.id+'">编辑</button></div></div>'}).join('')||emptyBox('还没有储蓄目标','target');openSheet('储蓄目标',html,{foot:'<button class="btn primary block" data-act="newEntity" data-e="goal">＋ 新增目标</button>'})}
function openInstallments(){const html=state.installments.map(x=>'<div class="card tight"><div class="between"><div style="font-weight:650">'+esc(x.name)+(x.active?'':'（已结束）')+'</div><span class="badge">'+x.paid+' / '+x.periods+' 期</span></div><div class="small muted" style="margin:6px 0">每期 '+yuan(x.per,2)+' · 总额 '+yuan(x.total,0)+' · 剩余 '+yuan(Math.max(0,x.total-x.paid*x.per),0)+'</div><div class="progress"><i style="width:'+pct(x.paid,x.periods)+'%"></i></div><div class="row" style="margin-top:10px;gap:8px"><span class="small muted grow">下期 '+esc(x.nextDate)+'</span><button class="btn sm" data-act="doInstallment" data-id="'+x.id+'">记一期</button><button class="btn sm ghost" data-act="editEntity" data-e="installment" data-id="'+x.id+'">编辑</button></div></div>').join('')||emptyBox('还没有分期计划','calendar');openSheet('分期计划',html,{foot:'<button class="btn primary block" data-act="newEntity" data-e="installment">＋ 新增分期</button>'})}
function openRates(){const html='<div class="hint" style="margin-bottom:12px">汇率表示 1 单位外币 ≈ 多少人民币。记账时选择币种，金额会自动换算后入账，原始金额也会保留。</div>'+CURRS.map(c=>'<div class="row" style="padding:7px 0"><span class="grow small">'+c[0]+' · '+c[1]+'</span><input type="number" step="any" data-rate="'+c[0]+'" value="'+(state.rates[c[0]]||1)+'" style="width:110px;min-height:34px;padding:6px 9px"></div>').join('');openSheet('多币种与汇率',html,{foot:'<button class="btn primary block" data-act="saveRates">保存汇率</button>'})}
function openFilters(){const html=state.savedFilters.length?'<div class="list">'+state.savedFilters.map((f,i)=>'<div class="list-item" data-act="applyFilter" data-i="'+i+'"><div class="ico-box">'+ico('filter')+'</div><div class="grow"><div class="label">'+esc(f.name)+'</div><div class="desc">'+esc(filterDesc(f.f))+'</div></div><button class="btn sm danger" data-act="delFilter" data-i="'+i+'">删除</button></div>').join('')+'</div>':emptyBox('还没有保存的筛选','filter');openSheet('保存的筛选',html,{foot:'<button class="btn primary block" data-act="saveCurrentFilter">保存当前筛选条件</button>'})}
function filterDesc(f){return [f.type&&f.type!=='all'?(f.type==='expense'?'支出':f.type==='income'?'收入':'转账'):'',f.category?cat(f.category).name:'',f.account?acc(f.account).name:'',f.tag?'#'+tagName(f.tag):'',f.min?'≥'+f.min:'',f.max?'≤'+f.max:''].filter(Boolean).join(' · ')||'全部账单'}
function openFilter(){const f=ui.filter||{};const html='<div class="field"><label>收支类型</label><select id="flType"><option value="all">全部</option><option value="expense" '+(f.type==='expense'?'selected':'')+'>支出</option><option value="income" '+(f.type==='income'?'selected':'')+'>收入</option><option value="transfer" '+(f.type==='transfer'?'selected':'')+'>转账</option></select></div><div class="field"><label>分类</label><select id="flCat"><option value="">全部分类</option>'+catOpts().map(c=>'<option value="'+c[0]+'" '+(f.category===c[0]?'selected':'')+'>'+esc(c[1])+'</option>').join('')+'</select></div><div class="field"><label>账户</label><select id="flAcc"><option value="">全部账户</option>'+accOpts().map(c=>'<option value="'+c[0]+'" '+(f.account===c[0]?'selected':'')+'>'+esc(c[1])+'</option>').join('')+'</select></div><div class="field"><label>标签</label><select id="flTag"><option value="">全部标签</option>'+state.tags.map(t=>'<option value="'+t.id+'" '+(f.tag===t.id?'selected':'')+'>'+esc(t.name)+'</option>').join('')+'</select></div><div class="form-row"><div class="field"><label>最小金额</label><input type="number" id="flMin" value="'+esc(f.min||'')+'" placeholder="不限"></div><div class="field"><label>最大金额</label><input type="number" id="flMax" value="'+esc(f.max||'')+'" placeholder="不限"></div></div>';openSheet('筛选账单',html,{foot:'<div class="btn-row"><button class="btn ghost" data-act="resetFilter">重置</button><button class="btn primary" data-act="applyFilterNow">应用筛选</button></div>'})}
function openTrash(){const html=state.trash.length?'<div class="list">'+state.trash.map(x=>'<div class="list-item"><div class="ico-box">'+ico('trash')+'</div><div class="grow"><div class="label">'+esc(x.txn.note||cat(x.txn.categoryId).name)+'</div><div class="desc">'+x.txn.date.slice(0,10)+' · 删除于 '+x.at+'</div></div><span class="small num">'+yuan(x.txn.amount,0)+'</span><button class="btn sm" data-act="restoreTrash" data-i="'+state.trash.indexOf(x)+'">还原</button></div>').join('')+'</div>':emptyBox('回收站是空的','trash');openSheet('回收站',html,{foot:state.trash.length?'<button class="btn danger block" data-act="emptyTrash">清空回收站</button>':''})}
function openHistory(){const html=state.history.length?'<div class="list">'+state.history.map(h=>'<div class="list-item"><div class="ico-box">'+ico('list')+'</div><div class="grow"><div class="label">'+esc(h.action)+'</div><div class="desc">'+esc(new Date(h.at).toLocaleString('zh-CN'))+'</div></div></div>').join('')+'</div>':emptyBox('暂无操作记录','list');openSheet('操作历史',html)}

function exportCSV(){const head=['日期','时间','类型','金额','分类','账户','转入账户','备注','标签','账本','币种','原始金额','票据','地点'];const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const rows=bookTxns().slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date.slice(0,10),t.date.slice(11,16),t.type==='expense'?'支出':t.type==='income'?'收入':'转账',t.amount,t.categoryId?cat(t.categoryId).name:'',acc(t.accountId).name,t.toAccountId?acc(t.toAccountId).name:'',t.note||'',(t.tags||[]).map(tagName).join(' '),book().name,t.origCurrency||'CNY',t.origAmount||t.amount,t.photo?'有':'',t.location||''].map(q).join(','));download('轻账-'+book().name+'-'+today()+'.csv',head.map(q).join(',')+'\n'+rows.join('\n'),'text/csv;charset=utf-8');toast('已导出 '+rows.length+' 笔账单');addHistory('导出 CSV')}

function handleRestore(file){const r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(String(r.result).replace(/^\uFEFF/,''))}catch(e){toast('文件不是有效的 JSON 备份');return}if(!d||!Array.isArray(d.txns)||!d.settings){toast('备份格式不正确');return}confirmBox('确认还原','将用备份覆盖当前数据：'+d.txns.length+' 笔账单。此操作不可撤销。',()=>{state=d;const base=defaultState();state.settings=Object.assign({},base.settings,state.settings||{});['books','accounts','categories','tags','txns','recurring','subscriptions','goals','installments','templates','savedFilters','trash','history'].forEach(k=>{if(!Array.isArray(state[k]))state[k]=base[k]});if(!state.categories.length)seedCategories(state);ui.selected=[];save();render();toast('已还原 '+state.txns.length+' 笔账单');addHistory('还原备份')},'覆盖还原')};r.readAsText(file,'utf-8')}
function parseCSV(text){const s=text.replace(/^\uFEFF/,'');const probe=s.split('\n').slice(0,8).join('\n');const sep=(probe.split('\t').length>probe.split(',').length)?'\t':',';const out=[];let row=[],cell='',quoted=false;for(let i=0;i<s.length;i++){const c=s[i];if(quoted){if(c==='"'){if(s[i+1]==='"'){cell+='"';i++}else quoted=false}else cell+=c}else if(c==='"')quoted=true;else if(c===sep){row.push(cell.trim());cell=''}else if(c==='\n'){row.push(cell.trim());if(row.some(x=>x!==''))out.push(row);row=[];cell=''}else if(c!=='\r')cell+=c}row.push(cell.trim());if(row.some(x=>x!==''))out.push(row);return out}
function openImport(){const html='<div class="card tight"><div class="field"><label>选择账单文件（CSV / TSV）</label><input type="file" accept=".csv,.tsv,.txt,text/csv" id="importFile"></div><div class="hint">支持微信、支付宝、银行导出的 CSV。微信/支付宝通常前几行是说明文字，本工具会自动跳过表头之前的内容。文件仅在本机解析，不会上传。</div></div><div id="importMap"></div>';openSheet('账单导入',html)}
function guessCol(headers,keys){for(let i=0;i<headers.length;i++){const h=String(headers[i]);if(keys.some(k=>h.includes(k)))return i}return -1}
function handleImportFile(file){const r=new FileReader();r.onload=()=>{const rows=parseCSV(String(r.result));if(rows.length<2){toast('文件内容太少或未识别为表格');return}let hi=0;for(let i=0;i<Math.min(rows.length,20);i++){if(rows[i].length>=3&&rows[i].some(c=>/时间|日期|金额|交易|收\/支|分类/.test(c))){hi=i;break}}const headers=rows[hi],data=rows.slice(hi+1).filter(x=>x.length>=2&&x.some(c=>c!==''));ui.import={headers,data};const g={date:guessCol(headers,['交易时间','时间','日期','date']),amount:guessCol(headers,['金额','amount','发生额']),type:guessCol(headers,['收/支','收支','类型','方向']),category:guessCol(headers,['交易分类','分类','category','类型']),note:guessCol(headers,['商品说明','备注','交易对方','商户','说明','摘要']),account:guessCol(headers,['支付方式','账户','付款方式'])};const opt=(id,label,sel)=>'<div class="field"><label>'+label+'</label><select id="'+id+'"><option value="-1">不导入</option>'+headers.map((h,i)=>'<option value="'+i+'" '+(i===sel?'selected':'')+'>'+i+' · '+esc(h)+'</option>').join('')+'</select></div>';$('#importMap').innerHTML='<div class="card"><div class="card-h"><h3>字段映射</h3><span class="badge">'+data.length+' 行</span></div>'+opt('imDate','日期列',g.date)+opt('imAmount','金额列',g.amount)+opt('imType','收 / 支列（可留空，按金额正负判断）',g.type)+opt('imCat','分类名称列',g.category)+opt('imNote','备注列',g.note)+opt('imAcc','账户 / 支付方式列',g.account)+'<button class="btn primary block" data-act="importPreview">预览并去重</button></div>'};r.readAsText(file,'utf-8')}
function buildImport(){const d=ui.import,get=k=>Number(document.getElementById(k)?.value??-1);const map={date:get('imDate'),amount:get('imAmount'),type:get('imType'),category:get('imCat'),note:get('imNote'),account:get('imAcc')};const existing=new Set(bookTxns().map(t=>t.date.slice(0,10)+'|'+Math.round(t.amount*100)+'|'+(t.note||'')));const out=[],dups=[];const cleanAmount=s=>Number(String(s||'').replace(/[^\d.\-]/g,''))||0;const cleanDate=s=>{const m=String(s||'').match(/(\d{4})[-\/年.](\d{1,2})[-\/月.](\d{1,2})/);if(m)return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);const t=String(s||'').match(/(\d{1,2})[-\/月.](\d{1,2})/);return t?new Date().getFullYear()+'-'+pad(t[1])+'-'+pad(t[2]):today()};d.data.forEach(row=>{let a=cleanAmount(row[map.amount]);if(!a)return;const raw=String(row[map.type]||'');let type=/收|收入|income/.test(raw)?'income':/支|支出|expense|付款/.test(raw)?'expense':a>0?'income':'expense';a=Math.abs(a);const date=cleanDate(map.date>=0?row[map.date]:'');const note=map.note>=0?String(row[map.note]||''):'';const key=date+'|'+Math.round(a*100)+'|'+note;if(existing.has(key)){dups.push(key);return}existing.add(key);let cname=map.category>=0?String(row[map.category]||''):'';let c=state.categories.find(x=>x.type===type&&x.name===cname)||state.categories.find(x=>x.type===type&&x.name==='其他')||state.categories.find(x=>x.type===type)||state.categories[0];let aname=map.account>=0?String(row[map.account]||''):'';let ac=state.accounts.find(x=>x.name.includes(aname)&&aname)||state.accounts[0];out.push({id:uid(),type,amount:a,accountId:ac.id,categoryId:c.id,note:note||cname||'导入账单',date:date+' 12:00',bookId:state.settings.currentBook,tags:[],origCurrency:'CNY',origAmount:a,createdAt:today(),imported:true})});ui.import.result=out;ui.import.dups=dups.length;return out}
function importPreview(){const out=buildImport(),d=ui.import;if(!out.length){toast('没有可导入的新账单（可能全部重复或字段映射不对）');return}const html='<div class="card tight"><div class="between"><span class="small">可导入 <b>'+out.length+'</b> 笔</span><span class="badge warn">跳过重复 '+d.dups+' 笔</span></div><div class="tiny muted" style="margin-top:6px">去重规则：同日期 + 同金额 + 同备注</div></div><div class="list">'+out.slice(0,6).map(t=>'<div class="list-item"><div class="ico-box">'+ico(t.type==='income'?'cash':'bag')+'</div><div class="grow"><div class="label ellip">'+esc(t.note)+'</div><div class="desc">'+t.date.slice(0,10)+' · '+cat(t.categoryId).name+' · '+acc(t.accountId).name+'</div></div><span class="small num">'+(t.type==='income'?'+':'-')+yuan(t.amount)+'</span></div>').join('')+'</div>'+(out.length>6?'<div class="hint">仅预览前 6 笔，共 '+out.length+' 笔。</div>':'');openSheet('导入预览',html,{foot:'<div class="btn-row"><button class="btn ghost" data-act="openImport">重新映射</button><button class="btn primary" data-act="importCommit">确认导入 '+out.length+' 笔</button></div>'})}
function importCommit(){const out=ui.import?.result||[];if(!out.length){toast('没有待导入数据');return}state.txns.push(...out);save();closeSheet();render();toast('已导入 '+out.length+' 笔账单','撤销',()=>{state.txns=state.txns.filter(t=>!out.includes(t));save();render();toast('已撤销导入')});addHistory('导入 '+out.length+' 笔')}
function exportImage(){const st=statOf(rangeList()),cs=catStat(rangeList(),'expense').slice(0,6),w=720,h=520,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#f7f8fc';x.fillRect(0,0,w,h);x.fillStyle='#171b26';x.font='600 30px sans-serif';x.fillText('轻账 · 收支报表',40,60);x.fillStyle='#6d7688';x.font='16px sans-serif';x.fillText(rangeMonths()[0]+' ~ '+rangeMonths()[rangeMonths().length-1]+'    ·    '+book().name,40,92);x.fillStyle='#fff';x.fillRect(40,120,w-80,110);x.fillStyle='#e2603f';x.font='600 26px sans-serif';x.fillText('支出 '+yuan(st.e,0),62,168);x.fillStyle='#12996f';x.fillText('收入 '+yuan(st.i,0),62,212);x.fillStyle='#5b5bd6';x.fillText('结余 '+yuan(st.net,0),390,168);x.fillStyle='#6d7688';x.font='16px sans-serif';x.fillText('分类支出排行',40,272);const max=Math.max(1,...cs.map(c=>c[1]));cs.forEach(([id,v],i)=>{const cc=cat(id),y=300+i*34;x.fillStyle='#171b26';x.font='15px sans-serif';x.fillText(cc.name,40,y);x.fillStyle='#e9edf4';x.fillRect(150,y-13,420,14);x.fillStyle=cc.color;x.fillRect(150,y-13,Math.max(4,420*v/max),14);x.fillStyle='#6d7688';x.fillText(yuan(v,0),585,y)});x.fillStyle='#a0a9b9';x.font='13px sans-serif';x.fillText('轻账 · 数据仅存本机 · 生成于 '+today(),40,h-30);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='轻账报表-'+today()+'.png';a.click();toast('报表图片已生成');addHistory('导出报表图片')}

function showLock(){if(!state.settings.lockEnabled||!state.settings.pin)return;let buf='';const draw=()=>{$('#lockHost').innerHTML='<div class="lock"><div style="width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center">'+ico('lock')+'</div><div class="lt">轻账已锁定</div><div class="lp">输入 PIN 解锁</div><div class="ldots">'+[0,1,2,3,4,5].slice(0,state.settings.pin.length).map(i=>'<i class="'+(i<buf.length?'on':'')+'"></i>').join('')+'</div><div class="lkeys">'+[1,2,3,4,5,6,7,8,9].map(n=>'<button data-act="pinKey" data-k="'+n+'">'+n+'</button>').join('')+'<button data-act="pinKey" data-k="C">清除</button><button data-act="pinKey" data-k="0">0</button><button data-act="pinKey" data-k="del">⌫</button></div></div>'};draw();showLock._draw=draw;showLock._buf=()=>buf;showLock._set=v=>{buf=v;draw()};showLock._close=()=>{$('#lockHost').innerHTML=''}}
function checkDue(){let n=0;const td=today();state.recurring.filter(r=>r.active).forEach(r=>{let guard=0;while(r.nextDate<=td&&guard<12){state.txns.push({id:uid(),type:r.type,amount:r.amount,accountId:r.accountId,categoryId:r.categoryId,note:r.name+(r.note?' · '+r.note:'')+'（周期）',date:r.nextDate+' 09:00',bookId:state.settings.currentBook,tags:['t1'],createdAt:td,recurringId:r.id,origCurrency:'CNY'});r.nextDate=r.freq==='monthly'?addMonths(r.nextDate,1):r.freq==='weekly'?shiftDate(r.nextDate,7):r.freq==='yearly'?addMonths(r.nextDate,12):shiftDate(r.nextDate,1);n++;guard++}});if(n){save();toast('已自动补记 '+n+' 笔周期账单');addHistory('自动生成 '+n+' 笔周期账单')}state.settings.lastOpen=td;save()}
function notifyTasks(){if(!state.settings.notify||!('Notification' in window)||Notification.permission!=='granted')return;const t=pendingTasks();if(t.length){try{new Notification('轻账 · '+t.length+' 项待办',{body:t.slice(0,2).map(x=>x.title).join('\n')})}catch(e){}}}

function advanceRec(r){return r.freq==='monthly'?addMonths(r.nextDate,1):r.freq==='weekly'?shiftDate(r.nextDate,7):r.freq==='yearly'?addMonths(r.nextDate,12):shiftDate(r.nextDate,1)}

function txnBack(t,note,type){const c=state.categories.find(x=>x.type===type)||state.categories[0];return{id:uid(),type,amount:t.amount,accountId:t.accountId,categoryId:c.id,note:note+(t.note?' · '+t.note:''),date:nowLocal().replace('T',' '),bookId:t.bookId,tags:[],createdAt:today(),origCurrency:'CNY'}}
function handlePhoto(file){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,720/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));c.getContext('2d').drawImage(img,0,0,c.width,c.height);ui.add.photo=c.toDataURL('image/jpeg',.72);const h=$('#photoHint');if(h)h.textContent='已附加票据 · '+Math.round(ui.add.photo.length/1024)+' KB';toast('票据已压缩并存入本机')};img.src=String(r.result)};r.readAsDataURL(file)}

doRecurring:d=>{const r=state.recurring.find(x=>x.id===d.id);if(!r)return;state.txns.push(recTxn(r,r.nextDate));r.nextDate=advanceRec(r);addHistory('生成周期账单 '+r.name);refresh();toast('已生成：'+r.name+' '+yuan(r.amount))},
runRecurring:()=>{checkDue();render();toast('已检查全部周期账单的到期情况')},
doSubscription:d=>{const s=state.subscriptions.find(x=>x.id===d.id);if(!s)return;state.txns.push(generateTxnFrom(s));s.nextDate=s.cycle==='yearly'?addMonths(s.nextDate,12):s.cycle==='weekly'?shiftDate(s.nextDate,7):addMonths(s.nextDate,1);addHistory('订阅扣款 '+s.name);refresh();toast('已记账：'+s.name+' '+yuan(s.amount))},
doInstallment:d=>{const x=state.installments.find(y=>y.id===d.id);if(!x)return;if(x.paid>=x.periods){toast('该分期已全部结清');return}state.txns.push({id:uid(),type:'expense',amount:x.per,accountId:x.accountId,categoryId:x.categoryId,note:x.name+' 第 '+(x.paid+1)+' 期',date:x.nextDate+' 10:00',bookId:state.settings.currentBook,tags:[],createdAt:today(),installmentId:x.id,origCurrency:'CNY'});x.paid++;x.nextDate=addMonths(x.nextDate,1);if(x.paid>=x.periods)x.active=false;addHistory('分期记账 '+x.name);refresh();toast('已记第 '+x.paid+' 期 · '+yuan(x.per))},
homeUp:d=>{const a=state.settings.homeCards,i=a.indexOf(d.k);if(i>0){[a[i-1],a[i]]=[a[i],a[i-1]];save();customizeHome();render()}},
homeDown:d=>{const a=state.settings.homeCards,i=a.indexOf(d.k);if(i>=0&&i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]];save();customizeHome();render()}},
homeToggle:d=>{const a=state.settings.homeCards,i=a.indexOf(d.k);if(i>=0)a.splice(i,1);else a.push(d.k);save();customizeHome();render()},
importPreview:()=>importPreview(),
importCommit:()=>importCommit(),
onboardStart:d=>{state.settings.onboarded=true;if(d.v==='keep')loadDemoData();else clearDemo();save();$('#onboardHost').innerHTML='';render()},
pinKey:d=>{const f=showLock;if(!f._buf)return;let b=f._buf(),k=d.k;if(k==='C')b='';else if(k==='del')b=b.slice(0,-1);else b=(b+k).slice(0,state.settings.pin.length);f._set(b);if(b===state.settings.pin){f._close();toast('已解锁')}else if(b.length>=state.settings.pin.length){toast('PIN 不正确，请重试');setTimeout(()=>f._set(''),300)}}
};
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('[data-act]');if(!el)return;const fn=ACTIONS[el.dataset.act];if(!fn)return;e.preventDefault();try{fn(el.dataset,el,e)}catch(err){console.error('[轻账]',el.dataset.act,err);toast('操作出错：'+err.message)}});
document.addEventListener('input',e=>{if(e.target.id==='searchInput'){ui.search=e.target.value;ui._resetScroll=false;render();const n=$('#searchInput');if(n){n.focus();try{n.setSelectionRange(n.value.length,n.value.length)}catch(x){}}}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='importFile'&&el.files?.[0]){handleImportFile(el.files[0]);return}if(el.id==='restoreFile'&&el.files?.[0]){handleRestore(el.files[0]);return}if(el.id==='addPhoto'&&el.files?.[0]){handlePhoto(el.files[0]);return}const k=el.dataset.chg;if(!k||k==='search')return;if(k==='fontScale'){state.settings.fontScale=Number(el.value)||1;save();applyTheme()}else if(k==='reduceMotion'){state.settings.reduceMotion=el.checked;save();applyTheme()}else if(k==='hideAmount'){state.settings.hideAmount=el.checked;save();render()}else if(k==='notify'){state.settings.notify=el.checked;save();render()}else if(k==='customFrom'){ui.customFrom=el.value;render()}else if(k==='customTo'){ui.customTo=el.value;render()}});
function init(){setupPWA();checkDue();render();showOnboard();showLock();notifyTasks();if(window.matchMedia){const mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',()=>{if(state.settings.theme==='auto')applyTheme()})}document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.settings.lastOpen!==today())checkDue()})}
init();
</script>
</body>
</html>
